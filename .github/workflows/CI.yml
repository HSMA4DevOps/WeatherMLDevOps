name: CI

# (a) Detect changes to the GitHub repository
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  # Change this to v2 (etc.) when you release a new version.
  # CD.yml reads this same line, so it only needs changing here.
  IMAGE_VERSION: v1
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/weather-ml-app
  # Should match the Python version in your Dockerfile's FROM line
  PYTHON_VERSION: '3.9'

jobs:
  build-test-push:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tags
        run: |
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          # Unique tag per build, e.g. v2-a1b2c3d, so Kubernetes always sees a new version
          echo "BUILD_TAG=${IMAGE_VERSION}-${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # (b) Install Flask and the dependencies in requirements.txt
      - name: Install Flask and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask
          pip install -r requirements.txt

      # (c) Run each Task 2 test file in its own step, in order
      - name: Run smoke test
        run: python -m unittest -v tests/smoke_test.py

      - name: Run unit test
        run: python -m unittest -v tests/unit_test.py

      - name: Run integration test
        run: python -m unittest -v tests/integration_test.py

      # (d) Build a Docker image from the Dockerfile
      #     (Docker comes preinstalled on GitHub's ubuntu-latest runners)
      - name: Check Docker is set up
        run: docker version

      - name: Build Docker image
        run: |
          docker build \
            -t "$IMAGE_NAME:$BUILD_TAG" \
            -t "$IMAGE_NAME:$IMAGE_VERSION" \
            -t "$IMAGE_NAME:latest" \
            .
          docker images "$IMAGE_NAME"

      # (e) Build test: launch a container from the image and run a command inside it
      - name: Build test - launch container
        run: |
          docker run -d --name build-test "$IMAGE_NAME:$BUILD_TAG"
          sleep 10
          docker ps -a --filter name=build-test

      - name: Build test - run command inside container
        run: |
          if [ "$(docker inspect -f '{{.State.Running}}' build-test)" != "true" ]; then
            echo "Container did not stay running. Logs:"
            docker logs build-test
            exit 1
          fi
          docker exec build-test python -c "import flask; print('Container launched OK - Flask', flask.__version__)"
          docker exec build-test ls -la

      - name: Build test - remove container
        if: always()
        run: docker rm -f build-test || true

      # (f) Push the image to Docker Hub (pushes to main only, not pull requests)
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        if: github.event_name != 'pull_request'
        run: |
          docker push "$IMAGE_NAME:$BUILD_TAG"
          docker push "$IMAGE_NAME:$IMAGE_VERSION"
          docker push "$IMAGE_NAME:latest"
